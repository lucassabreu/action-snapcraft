name: Snapcraft Action
description: GitHub Action for setting up Snapcraft

runs:
  using: composite
  steps:
    - run: sudo apt-get update -q
    - run: sudo apt-get install -qy snapd
    - run: sudo chown root:root /
    - run: sudo systemctl enable --now snapd
    - run: sudo systemctl restart snapd
    - run: sudo snap install lxd
    - run: sudo lxd init --auto
    - run: sudo iptables -P FORWARD ACCEPT
    - run: echo /snap/bin >> ${{ env.GITHUB_PATH }}
    - run: sudo snap install --classic snapcraft

branding:
  icon: upload-cloud
  color: green
